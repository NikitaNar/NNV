  <!-- JS ДЛЯ ФИЛЬТРАЦИИ, КЕЙСОВ, ЛАЙТБОКСА И BACK-TO-TOP -->
 <script>
    let currentCardElement = null;

    const brandingProjects = {
      frameworkfest: {
        title: "Framework Fest",
        sub: "Film Festival Visual Identity",
        desc: "Comprehensive visual identity system for an independent film festival. Built around modular frame geometry, bold editorial typography, print booklets, tickets, and VIP/Press accreditation badges.",
        images: [
          "images/Branding_Identity/FrameworkFest/FrameworkFest_poster.webp",
          "images/Branding_Identity/FrameworkFest/FrameworkFest_logo.webp",
          "images/Branding_Identity/FrameworkFest/FrameworkFest_post.webp",
          "images/Branding_Identity/FrameworkFest/FrameworkFest_booklet.webp",
          "images/Branding_Identity/FrameworkFest/FrameworkFest_ticket.webp",
          "images/Branding_Identity/FrameworkFest/FrameworkFest_IDCARD_PRESS.webp",
          "images/Branding_Identity/FrameworkFest/FrameworkFest_IDCARD_VIP.webp",
          "images/Branding_Identity/FrameworkFest/FrameworkFest_IDCARD_visitor.webp"
        ]
      },
      vscl: {
        title: "VSCL Specialty Coffee",
        sub: "Packaging & Coffee Lab Identity",
        desc: "Minimalist packaging and brand system for a specialty coffee roastery. Built around clean typographic hierarchy, tactile paper bags, takeaway cups, and storefront signage.",
        images: [
          "images/Branding_Identity/VSCL/VSCL_package2.webp",
          "images/Branding_Identity/VSCL/VSCL_Coffee Cups.webp",
          "images/Branding_Identity/VSCL/VSCL_PAPER BAG.webp",
          "images/Branding_Identity/VSCL/VSCL_sign.webp",
          "images/Branding_Identity/VSCL/VSCL_card.webp"
        ]
      },
      fafest: {
        title: "Fa Fest 2026",
        sub: "Classical Music Festival Identity",
        desc: "Visual language for a contemporary classical music festival. Designed across large-format outdoor banners, posters, event wristbands, tickets, and merchandise.",
        images: [
          "images/Branding_Identity/FaFest/FaFest_WEB.webp",
          "images/Branding_Identity/FaFest/Banner.webp",
          "images/Branding_Identity/FaFest/BANNER WALL.webp",
          "images/Branding_Identity/FaFest/Poster2.webp",
          "images/Branding_Identity/FaFest/Badge 2.webp",
          "images/Branding_Identity/FaFest/FaFest_bracelet.webp",
          "images/Branding_Identity/FaFest/cup.webp",
          "images/Branding_Identity/FaFest/Roller.webp",
          "images/Branding_Identity/FaFest/Ticket2.webp"
        ]
      },
      fairhelm: {
        title: "FairHelm",
        sub: "B2B Brand Identity, Motion & Guidelines",
        desc: "End-to-end brand identity, logo animation, and an 11-page brand book for FairHelm, establishing colour architecture, typography, and digital communication standards.",
        images: [
          "images/Animation/FairHelm_animation_NEW.gif",
          "images/Branding_Identity/FairHelm/FairHelm_Post1.webp",
          "images/Branding_Identity/FairHelm/FairHelm_Post2.webp",
          "images/Branding_Identity/FairHelm/BB1_1.webp",
          "images/Branding_Identity/FairHelm/BB1_2.webp",
          "images/Branding_Identity/FairHelm/BB1_3.webp",
          "images/Branding_Identity/FairHelm/BB1_4.webp",
          "images/Branding_Identity/FairHelm/BB1_5.webp",
          "images/Branding_Identity/FairHelm/BB1_6.webp",
          "images/Branding_Identity/FairHelm/BB1_7.webp",
          "images/Branding_Identity/FairHelm/BB1_8.webp",
          "images/Branding_Identity/FairHelm/BB1_9.webp",
          "images/Branding_Identity/FairHelm/BB1_10.webp",
          "images/Branding_Identity/FairHelm/BB1_11.webp"
        ]
      },
      kraken: {
        title: "Kraken's Touch: Graduation Project",
        sub: "From 3D Emotional Form Language in Blender to Handcrafted Physical Guitar (2026)",
        pdf: "images/About/Diploma_Presentation.pdf",
        desc: "Concept: Guitar as Personality. Exploring how silhouette, clay form, and graphic patterns express three emotional states (Calm, Warm, Aggressive). Process: moodboards, hand sketches, clay sculpting, procedural patterns, 3D modeling in Blender, and CNC/hand-shaping into a playable electric guitar.",
        images: [
          "images/About/B1.webp",
          "images/3D/agressive_guitar.webp",
          "images/3D/warm_guitar.webp",
          "images/3D/calm_guitar.webp",
          "images/About/diploma_guitar.webp",
          "images/About/me_graduated.webp"
        ]
      }
    };

    /* Получить ID кейса из карточки (если она кейсовая) */
    function getCardProjectId(card) {
      if (!card) return null;
      const onclickAttr = card.getAttribute('onclick') || '';
      const match = onclickAttr.match(/openProject\('([^']+)'\)/);
      return match ? match[1] : null;
    }

    /* Единый список всех видимых работ в активной категории (без дублирования одного и того же кейса) */
    function getNavigableCards() {
      const visibleCards = Array.from(document.querySelectorAll('.card:not(.cta-case-card)'))
        .filter(card => card.style.display !== 'none');

      const seenProjects = new Set();
      return visibleCards.filter(card => {
        const pid = getCardProjectId(card);
        if (pid) {
          if (seenProjects.has(pid)) return false;
          seenProjects.add(pid);
        }
        return true;
      });
    }

    /* Найти следующую/предыдущую карточку в едином потоке */
    function getAdjacentCard(step) {
      const cards = getNavigableCards();
      if (!cards.length) return null;

      let idx = cards.indexOf(currentCardElement);
      if (idx === -1 && currentCardElement) {
        const pid = getCardProjectId(currentCardElement);
        if (pid) {
          idx = cards.findIndex(c => getCardProjectId(c) === pid);
        }
      }
      if (idx === -1) idx = 0;

      const nextIdx = (idx + step + cards.length) % cards.length;
      return cards[nextIdx];
    }

    /* Открыть любую карточку (либо как кейс, либо в лайтбоксе) */
    function openCardItem(card) {
      if (!card) return;
      const pid = getCardProjectId(card);
      if (pid) {
        document.getElementById('lightboxModal').classList.remove('active');
        openProject(pid, card);
      } else {
        document.getElementById('projectModal').classList.remove('active');
        openLightboxForCard(card);
      }
    }

    function filterProjects(category, btnElement) {
      const buttons = document.querySelectorAll('.filter-btn:not(.about-nav-btn)');
      const cards = document.querySelectorAll('.card');
      const gallery = document.querySelector('.gallery');

      buttons.forEach(btn => btn.classList.remove('active'));
      if (btnElement) btnElement.classList.add('active');

      if (gallery) {
        gallery.setAttribute('data-active-category', category);
      }

      const toReveal = [];

      cards.forEach(card => {
        if (card.classList.contains('cta-case-card')) {
          card.style.display = (category === 'all') ? 'flex' : 'none';
          return;
        }

        if (category === 'all' || card.classList.contains(category)) {
          card.classList.add('pre-fade');
          card.style.display = 'flex';
          toReveal.push(card);
        } else {
          card.style.display = 'none';
        }
      });

      requestAnimationFrame(() => {
        requestAnimationFrame(() => {
          toReveal.forEach(card => card.classList.remove('pre-fade'));
        });
      });
    }

    function openProject(projectId, sourceCard) {
      const proj = brandingProjects[projectId];
      if (!proj) return;

      if (sourceCard) {
        currentCardElement = sourceCard;
      } else {
        currentCardElement = Array.from(document.querySelectorAll('.card.clickable-case'))
          .find(c => getCardProjectId(c) === projectId) || null;
      }

      document.getElementById('modalTitle').innerText = proj.title;
      document.getElementById('modalSub').innerText = proj.sub;
      document.getElementById('modalDesc').innerText = proj.desc || '';
      
      const actionContainer = document.getElementById('modalActionContainer');
      actionContainer.innerHTML = proj.pdf
        ? `<a href="${proj.pdf}" target="_blank" class="btn-primary" style="display:inline-block; margin-top:16px;">Open Full Concept PDF →</a>`
        : '';
      
      const modalBody = document.getElementById('modalBody');
      const fragment = document.createDocumentFragment();

      proj.images.forEach((imgUrl, idx) => {
        const img = document.createElement('img');
        img.src = imgUrl;
        img.alt = proj.title;
        img.decoding = 'async';
        if (idx > 1) img.loading = 'lazy';
        fragment.appendChild(img);
      });

      modalBody.replaceChildren(fragment);

      const nextCard = getAdjacentCard(1);
      const nextBtn = document.getElementById('nextCaseBtn');
      if (nextCard) {
        const nextPid = getCardProjectId(nextCard);
        if (nextPid && brandingProjects[nextPid]) {
          nextBtn.innerText = `Next: ${brandingProjects[nextPid].title} →`;
        } else {
          const nextAlt = nextCard.querySelector('img')?.alt || 'Next Work';
          nextBtn.innerText = `Next: ${nextAlt} →`;
        }
      }

      const modal = document.getElementById('projectModal');
      modal.scrollTop = 0;
      modal.classList.add('active');
      document.body.style.overflow = 'hidden';
      updateBackToTopVisibility();
    }

    function openNextProject(event) {
      if (event) event.stopPropagation();
      const nextCard = getAdjacentCard(1);
      if (nextCard) openCardItem(nextCard);
    }

    function openPrevProject(event) {
      if (event) event.stopPropagation();
      const prevCard = getAdjacentCard(-1);
      if (prevCard) openCardItem(prevCard);
    }

    function closeProjectModal() {
      document.getElementById('projectModal').classList.remove('active');
      document.body.style.overflow = 'auto';
      updateBackToTopVisibility();
    }

    function closeModalOnOuterClick(event) {
      if (event.target.classList.contains('modal-overlay')) {
        closeProjectModal();
      }
    }

    /* ================= ЕДИНЫЙ ЛАЙТБОКС С ПЕРЕХОДОМ В КЕЙСЫ ================= */
    function openLightboxForCard(card) {
      const cards = getNavigableCards();
      const idx = cards.indexOf(card);
      if (idx === -1) return;

      currentCardElement = card;
      const img = card.querySelector('img');
      if (!img) return;

      const lbImg = document.getElementById('lightboxImg');
      lbImg.src = img.src;
      lbImg.alt = img.alt;
      lbImg.style.backgroundColor = (
        card.classList.contains('bg-white') ||
        card.classList.contains('contain-card') ||
        card.classList.contains('animation-card')
      ) ? '#ffffff' : 'transparent';

      document.getElementById('lightboxCaption').innerText = img.alt;
      document.getElementById('lightboxCounter').innerText = `${idx + 1} / ${cards.length}`;

      document.getElementById('lightboxModal').classList.add('active');
      document.body.style.overflow = 'hidden';
      updateBackToTopVisibility();
    }

    document.querySelectorAll('.card:not(.clickable-case):not(.cta-case-card)').forEach(card => {
      card.style.cursor = 'zoom-in';
      card.addEventListener('click', () => {
        openLightboxForCard(card);
      });
    });

    function navigateLightbox(step, event) {
      if (event) event.stopPropagation();
      const targetCard = getAdjacentCard(step);
      if (targetCard) openCardItem(targetCard);
    }

    function closeLightbox() {
      document.getElementById('lightboxModal').classList.remove('active');
      document.body.style.overflow = 'auto';
      updateBackToTopVisibility();
    }

    function closeLightboxOnOuterClick(event) {
      if (event.target.classList.contains('lightbox-overlay')) {
        closeLightbox();
      }
    }

    /* Поддержка свайпов в лайтбоксе */
    let touchStartX = 0;
    const lightboxEl = document.getElementById('lightboxModal');
    lightboxEl.addEventListener('touchstart', e => {
      touchStartX = e.changedTouches[0].screenX;
    }, { passive: true });

    lightboxEl.addEventListener('touchend', e => {
      const diff = e.changedTouches[0].screenX - touchStartX;
      if (Math.abs(diff) > 45) {
        navigateLightbox(diff < 0 ? 1 : -1);
      }
    }, { passive: true });

    /* Клавиатура: Esc, Left, Right в едином сквозном режиме */
    document.addEventListener('keydown', function(e) {
      const lbActive = document.getElementById('lightboxModal').classList.contains('active');
      const projActive = document.getElementById('projectModal').classList.contains('active');

      if (e.key === 'Escape') {
        if (lbActive) closeLightbox();
        if (projActive) closeProjectModal();
      } else if (e.key === 'ArrowRight') {
        if (lbActive || projActive) {
          const nextCard = getAdjacentCard(1);
          if (nextCard) openCardItem(nextCard);
        }
      } else if (e.key === 'ArrowLeft') {
        if (lbActive || projActive) {
          const prevCard = getAdjacentCard(-1);
          if (prevCard) openCardItem(prevCard);
        }
      }
    });

    /* ================= BACK TO TOP ================= */
    const backToTopBtn = document.getElementById('backToTopBtn');

    function updateBackToTopVisibility() {
      const anyModalOpen = document.querySelector('.modal-overlay.active') !== null;
      if (!anyModalOpen && window.scrollY > 500) {
        backToTopBtn.classList.add('visible');
      } else {
        backToTopBtn.classList.remove('visible');
      }
    }

    window.addEventListener('scroll', updateBackToTopVisibility, { passive: true });

    function scrollToTop() {
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    /* ================= COPY EMAIL ================= */
    function copyEmail() {
      navigator.clipboard.writeText('nikita@nareyko.com').then(() => {
        const toast = document.getElementById('copyToast');
        toast.classList.add('show');
        setTimeout(() => toast.classList.remove('show'), 2400);
      });
    }

    /* Авто-открытие кейса по хэшу в URL (например, index.html#kraken) */
    window.addEventListener('DOMContentLoaded', () => {
      const hash = window.location.hash.replace('#', '');
      if (hash && brandingProjects[hash]) {
        openProject(hash);
      }
    });

    /* Плавное появление картинок после полной загрузки */
    document.querySelectorAll('.card img').forEach(img => {
      if (img.complete && img.naturalWidth > 0) {
        img.classList.add('is-loaded');
      } else {
        img.addEventListener('load', () => img.classList.add('is-loaded'), { once: true });
        img.addEventListener('error', () => img.classList.add('is-loaded'), { once: true });
      }
    });
  </script>

</body>
</html>
